name: Instagram Scheduler

on:
  schedule:
    # Läuft alle 15 Minuten
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug mode'
        required: false
        default: 'false'

jobs:
  schedule-posts:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install && cd ..

      - name: Check scheduled posts
        run: |
          # Get current time in HH:MM format
          CURRENT_TIME=$(date +"%H:%M" -u)
          echo "Current time: $CURRENT_TIME"

          # Check if there are any scheduled posts for this time
          # In production, this would query the database/Supabase
          # For now, we'll just log the scheduled check
          echo "Checking for posts scheduled at $CURRENT_TIME..."

      - name: Trigger Netlify Function (schedule-posts)
        if: always()
        run: |
          curl -X POST https://sirkwtime-instagram.netlify.app/.netlify/functions/schedule-posts \
            -H "Content-Type: application/json" \
            -d '{
              "action": "check_and_post",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }' || echo "Function call attempt completed"

      - name: Log scheduler execution
        run: |
          echo "Instagram Scheduler executed at $(date -u)"
          echo "ANTHROPIC_API_KEY is set: ${{ secrets.ANTHROPIC_API_KEY != '' }}"
          echo "INSTAGRAM_ACCESS_TOKEN is set: ${{ secrets.INSTAGRAM_ACCESS_TOKEN != '' }}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            console.log('Scheduler workflow failed');
            // In production: send email/Slack notification
