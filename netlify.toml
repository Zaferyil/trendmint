[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Frontend calls same-origin /api/* — Netlify routes it to the proxy function,
# which is where the Etsy / Claude keys live.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback (must stay after the /api rule).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
