[build]
  command = "cd frontend && npm run build"
  functions = "functions"
  publish = "frontend/dist"

[dev]
  command = "cd frontend && npm run dev"
  port = 3000

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
